[project]
name = "hfeval"
version = "0.1.0"
description = "End-to-end eval harness for the herdr-fleet skill"
requires-python = ">=3.11"
dependencies = ["pyyaml>=6"]

[project.scripts]
hfeval = "hfeval.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["selftests"]
